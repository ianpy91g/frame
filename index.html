<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="相框">
<title>相框</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; position: relative;
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; }
  .slide { position: absolute; top: 0; left: 0; right: 0; bottom: 0; opacity: 0; overflow: hidden;
    -webkit-transition: opacity 2s ease-in-out; transition: opacity 2s ease-in-out; }
  .slide.on { opacity: 1; }
  .bg, .fg { position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-position: center; background-repeat: no-repeat; }
  .bg { background-size: cover; -webkit-filter: blur(40px) brightness(0.55); filter: blur(40px) brightness(0.55);
    top: -60px; left: -60px; right: -60px; bottom: -60px; }
  .fg { background-size: contain; -webkit-transform: scale(1); transform: scale(1); }

  #taken { position: absolute; right: 36px; bottom: 28px; color: #fff; text-align: right; display: none;
    text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
  #takenDate { font-size: 20px; line-height: 1.2; }
  #takenTime { font-size: 20px; margin-top: 4px; opacity: 0.85; }
  #msg { position: absolute; top: 50%; left: 0; right: 0; text-align: center; color: #aaa; font-size: 20px;
    margin-top: -14px; padding: 0 20px; line-height: 1.6; }
  #sleep { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #000; display: none; }
  body.sleeping #sleep { display: block; }
  #nightMsg { position: absolute; top: 50%; left: 0; right: 0; margin-top: -14px; text-align: center; color: #777;
    font-size: 22px; opacity: 0; -webkit-transition: opacity 1s; transition: opacity 1s; }
  #nightMsg.show { opacity: 1; }
  #awakeHint { position: absolute; left: 20px; top: 24px; display: none; color: #fff; font-size: 15px;
    opacity: 0.75; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  #pause { position: absolute; left: 36px; bottom: 30px; display: none; opacity: 0.85;
    -webkit-filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8)); filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8)); }
  #catPicker { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.72); display: none; z-index: 10; cursor: pointer; }
  #catPicker .box { position: absolute; top: 12%; left: 0; right: 0; margin: 0 auto; width: 420px; max-width: 88%; background: #1f2026; cursor: default; color: #fff; border-radius: 16px; padding: 26px 24px 20px; text-align: center; }
  #catPicker .title { font-size: 22px; margin-bottom: 18px; }
  #catList { max-height: 60vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #catList div { font-size: 20px; padding: 14px 16px; margin-bottom: 10px; border-radius: 10px; background: #2c2e36; text-align: left; cursor: pointer; }
  #catList div.current { background: #2a6f97; }
  #catList div.current:after { content: '  ✓'; }
  #catHint { color: #aaa; font-size: 15px; margin-top: 14px; min-height: 20px; }
  #pause span { display: inline-block; width: 8px; height: 30px; margin-right: 8px; background: #fff; border-radius: 2px; }
</style>
</head>
<body>
<div class="slide" id="s0"><div class="bg"></div><div class="fg"></div></div>
<div class="slide" id="s1"><div class="bg"></div><div class="fg"></div></div>
<div id="taken"><div id="takenDate"></div><div id="takenTime"></div></div>
<div id="msg">載入中…</div>
<div id="awakeHint"></div>
<div id="catPicker"><div class="box">
  <div class="title">選擇要播放的相簿</div>
  <div id="catList"></div>
  <div id="catHint"></div>
</div></div>
<audio id="bgm" preload="auto"></audio>
<div id="pause"><span></span><span></span></div>
<div id="sleep"><div id="nightMsg"></div></div>

<script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
<script>
// 網址格式：index.html?api=Apps Script 網頁應用程式網址（結尾 /exec）[&key=密碼]
var VERSION = 32; // 伺服器設定的 webVersion 比這個大時，相框會自動重新載入新版網頁
var CONFIG = { intervalSec: 15, shuffle: true, kenBurns: true, blurBackground: true,
  showPhotoDate: true, sleepFrom: 0, sleepTo: 0, refreshListMin: 30 };
var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
var ids = [], groups = [], plays = {}, order = [], pos = 0;
var slides = [document.getElementById('s0'), document.getElementById('s1')];
var cur = 1;
var pending = null, waiting = false, timer = null, started = false, fetching = false;

function $(id) { return document.getElementById(id); }
function msg(text) { $('msg').style.display = text ? 'block' : 'none'; $('msg').innerHTML = text || ''; }
function pad(n) { return n < 10 ? '0' + n : '' + n; }

function param(name) {
  var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
  return m ? decodeURIComponent(m[1]) : '';
}
var API = param('api'), KEY = param('key');

// 用 <script> 標籤跨網域呼叫 Apps Script（JSONP），舊版 Safari 也支援
var jsonpSeq = 0;
function api(query, ok, fail) {
  var name = '__frame_cb' + (++jsonpSeq);
  var s = document.createElement('script');
  var finished = false;
  function cleanup() {
    finished = true;
    try { delete window[name]; } catch (e) { window[name] = undefined; }
    if (s.parentNode) s.parentNode.removeChild(s);
  }
  window[name] = function (data) {
    if (finished) return;
    cleanup();
    if (data && data.ok) ok(data); else fail((data && data.error) || '未知錯誤');
  };
  s.onerror = function () { if (!finished) { cleanup(); fail('連線失敗'); } };
  setTimeout(function () { if (!finished) { cleanup(); fail('逾時'); } }, 60000);
  s.src = API + (API.indexOf('?') < 0 ? '?' : '&') + query + (KEY ? '&key=' + encodeURIComponent(KEY) : '') +
    '&callback=' + name + '&_=' + new Date().getTime();
  document.body.appendChild(s);
}

function shuffleList(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// 播過的照片記在 localStorage，重新載入也不會忘。不能只保留目前清單的照片：
// 選了分類時清單只有該分類，會把其他分類的紀錄清掉，換回來時全部被當成新照片。
var seen = {};
try { seen = JSON.parse(localStorage.getItem('frameSeen') || '{}') || {}; } catch (e) {}
function markSeen(id) {
  if (!id || seen[id]) return;
  seen[id] = 1;
  try { localStorage.setItem('frameSeen', JSON.stringify(seen)); } catch (e) {}
}

// 「新照片」：這台裝置沒播過，而且伺服器上所有裝置合計也還沒播過
function isNew(id) { return !seen[id] && !(plays[id] > 0); }

// 一組最多挑 max 張：還沒播過的優先，其次挑播放次數（所有裝置合計）最少的；
// 次數相同時隨機，結果維持拍攝時間順序。長期下來每張照片播放次數會趨於平均。
function pickFromGroup(list, max) {
  if (list.length <= max) return list.slice();
  var cand = [], chosen = {}, i;
  for (i = 0; i < list.length; i++) {
    cand.push({ id: list[i], seen: isNew(list[i]) ? 0 : 1, plays: plays[list[i]] || 0, r: Math.random() });
  }
  cand.sort(function (a, b) { return a.seen - b.seen || a.plays - b.plays || a.r - b.r; });
  for (i = 0; i < max; i++) chosen[cand[i].id] = true;
  var out = [];
  for (i = 0; i < list.length; i++) if (chosen[list[i]]) out.push(list[i]);
  return out;
}

// 排一輪的播放順序：有新照片的組（依最新上傳）排最前面，其他組隨機；組內依拍攝時間
function buildRound() {
  pos = 0;
  if (CONFIG.shuffle || !groups.length) { order = CONFIG.shuffle ? shuffleList(ids.slice()) : ids.slice(); return; }
  var fresh = [], rest = [], i, j;
  for (i = 0; i < groups.length; i++) {
    var hasNew = false;
    for (j = 0; j < groups[i].ids.length; j++) if (isNew(groups[i].ids[j])) { hasNew = true; break; }
    (hasNew ? fresh : rest).push(groups[i]);
  }
  var list = fresh.concat(shuffleList(rest));
  order = [];
  for (i = 0; i < list.length; i++) {
    var picked = pickFromGroup(list[i].ids, CONFIG.maxPerGroup || 30);
    if (i < fresh.length) picked = startAtFirstNew(picked);
    order = order.concat(picked);
  }
}

// 有新照片的組：從第一張新照片開始播，播到組尾再接回組頭補播前面的（時間順序不亂）
function startAtFirstNew(list) {
  for (var i = 0; i < list.length; i++) {
    if (isNew(list[i])) return list.slice(i).concat(list.slice(0, i));
  }
  return list;
}

// 重新讀到清單時：有新照片就重排一輪（新照片的組會排最前面）；只有刪除就把刪掉的移出順序
function refreshOrder(old) {
  var known = {}, current = {}, i, added = 0;
  for (i = 0; i < old.length; i++) known[old[i]] = true;
  for (i = 0; i < ids.length; i++) { current[ids[i]] = true; if (!known[ids[i]]) added++; }
  if (added) { buildRound(); return added; }
  var rest = [];
  for (i = pos; i < order.length; i++) if (current[order[i]]) rest.push(order[i]);
  order = rest;
  pos = 0;
  return 0;
}

// why：這次要清單的原因（start / timer / visible / pageshow / retry），連同狀態回報給伺服器做遠端診斷
function loadList(done, why) {
  var report = '&v=' + VERSION + '&sa=' + (navigator.standalone ? 1 : 0) +
    '&up=' + Math.round((new Date().getTime() - loadedAt) / 60000) + '&n=' + ids.length +
    '&pos=' + pos + '/' + order.length + '&aw=' + (isAwake() ? 1 : 0) + '&rs=' + awakeRestarts + '&mu=' + (musicOn ? 1 : 0) + '&why=' + (why || 'timer');
  api('action=list&cat=' + encodeURIComponent(CATEGORY) + report, function (data) {
    for (var k in data.config) { if (data.config.hasOwnProperty(k)) CONFIG[k] = data.config[k]; }
    if (CONFIG.webVersion > VERSION && !triedVersion(CONFIG.webVersion)) return reloadFresh(); // 伺服器說有新版網頁
    if (!CONFIG.music && musicOn) stopMusic();
    if (loadedApplyId === null) loadedApplyId = CONFIG.applyId || 0;
    else if ((CONFIG.applyId || 0) !== loadedApplyId) return reloadFresh(); // 設定頁改過設定
    var first = ids.length === 0;
    var old = ids;
    ids = data.ids || [];
    groups = data.groups || [];
    plays = data.plays || {};
    // 有新照片時，丟掉已預載的舊照片，讓下一張直接是新照片
    if (!first && refreshOrder(old) && !fetching) { pending = null; prefetch(); }
    tick();
    if (!ids.length) { msg('資料夾裡沒有照片'); setTimeout(function () { loadList(done, 'retry'); }, 60000); return; }
    if (first) buildRound();
    if (done) done();
  }, function (err) {
    if (!started) msg('讀取資料夾失敗，1 分鐘後重試<br><small>' + err + '</small>');
    setTimeout(function () { loadList(done, 'retry'); }, 60000);
  });
}

// 預先抓下一張照片，抓好後解碼完成才算準備好
function prefetch() {
  if (pos >= order.length) buildRound();
  var id = order[pos++];
  fetching = true;
  api('action=photo&id=' + encodeURIComponent(id), function (data) {
    data.photo.id = id;
    var img = new Image();
    img.onload = function () { fetching = false; pending = data.photo; if (waiting) advance(); };
    img.onerror = function () { fetching = false; setTimeout(prefetch, 1000); };
    img.src = data.photo.src;
  }, function () { fetching = false; setTimeout(prefetch, 5000); });
}

// 最近顯示過的照片（點兩下可以退回），histPos 指向目前顯示的那張
var shown = [], histPos = -1, paused = false, HISTORY_MAX = 10;

function advance() {
  clearTimeout(timer);
  if (paused) return;
  if (document.body.className === 'sleeping') { timer = setTimeout(advance, 60000); return; }
  // 退回去看過舊照片後繼續播：先依序播回退回前看過的那幾張
  if (histPos < shown.length - 1) {
    showPhoto(shown[++histPos]);
    timer = setTimeout(advance, CONFIG.intervalSec * 1000);
    return;
  }
  if (!pending) { waiting = true; return; }
  waiting = false;
  if (!started) { started = true; updateAwakeHint(); }
  var photo = pending;
  pending = null;
  markSeen(photo.id);
  plays[photo.id] = (plays[photo.id] || 0) + 1; // 本機先加，下一次讀清單前排順序也用得到
  shown.push(photo);
  if (shown.length > HISTORY_MAX) shown.shift();
  histPos = shown.length - 1;
  showPhoto(photo);
  prefetch();
  timer = setTimeout(advance, CONFIG.intervalSec * 1000);
}

// 點兩下：退回上一張並暫停（暫停時再點兩下可以繼續往前退）
// 向右滑：上一張。播放中會從這張重新計時；暫停中維持暫停
function showPrev() {
  if (!started || histPos <= 0) return;
  showPhoto(shown[--histPos]);
  if (!paused) { clearTimeout(timer); timer = setTimeout(advance, CONFIG.intervalSec * 1000); }
}

// 向左滑：下一張（下一張還在載入就載好立刻換）；暫停中換完仍維持暫停
function showNext() {
  if (!started) return;
  var wasPaused = paused;
  paused = false;
  if (pending || histPos < shown.length - 1) advance();
  else if (!wasPaused) waiting = true;
  if (wasPaused) { paused = true; waiting = false; clearTimeout(timer); }
}

// 點兩下：暫停照片和音樂
var musicPaused = false;
function pause() {
  if (paused) return;
  paused = true;
  waiting = false;
  clearTimeout(timer);
  if (musicOn) { try { $('bgm').pause(); } catch (e) {} musicPaused = true; }
  $('pause').style.display = 'block';
}

// 暫停中點一下：恢復照片和音樂（在點擊當下呼叫，iOS 才允許恢復播放聲音）
function resume() {
  paused = false;
  $('pause').style.display = 'none';
  if (musicPaused) {
    musicPaused = false;
    try { var p = $('bgm').play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
  timer = setTimeout(advance, CONFIG.intervalSec * 1000);
}

function showPhoto(photo) {
  var next = slides[1 - cur], old = slides[cur];
  var url = 'url("' + photo.src + '")';
  next.children[0].style.backgroundImage = CONFIG.blurBackground ? url : 'none';
  next.children[1].style.backgroundImage = url;
  // 緩慢放大用 transform 轉場（不用 keyframes 動畫）：舊版 iOS Safari 改 class 時會重算 keyframes
  // 讓照片跳回原尺寸，轉場則不受影響。新照片在透明時先歸回 1 倍再開始放大。
  var fg = next.children[1];
  fg.style.webkitTransition = fg.style.transition = 'none';
  fg.style.webkitTransform = fg.style.transform = 'scale(1)';
  void fg.offsetWidth; // 強制套用 1 倍，接下來的變化才會用轉場
  if (CONFIG.kenBurns) {
    var dur = (CONFIG.intervalSec + 4) + 's';
    fg.style.webkitTransition = '-webkit-transform ' + dur + ' linear';
    fg.style.transition = 'transform ' + dur + ' linear';
    fg.style.webkitTransform = fg.style.transform = 'scale(1.07)';
  }
  next.className = 'slide on';
  old.className = 'slide'; // 舊照片只淡出，放大轉場完全不動，會照原速繼續放大
  setTimeout(function () { // 淡出完成後釋放舊照片的記憶體
    if (old.className.indexOf('on') < 0) {
      old.children[0].style.backgroundImage = old.children[1].style.backgroundImage = 'none';
    }
  }, 2500);
  cur = 1 - cur;

  showTaken(photo.date);
  msg('');
}

// 每分鐘問伺服器一次：設定頁儲存過（applyId 變了）或有新版網頁，就重新載入套用
var loadedApplyId = null;
setInterval(function () {
  if (loadedApplyId === null) return;
  api('action=ping', function (d) {
    if ((d.applyId || 0) !== loadedApplyId) reloadFresh();
    else if (d.webVersion > VERSION && !triedVersion(d.webVersion)) reloadFresh();
  }, function () {});
}, 60000);

// 整頁重新載入；網址加時間參數避開快取（iOS 主畫面 app 會快取網頁）
// 先在 sessionStorage 記下「這次是自動重新載入」，載入後就不會跳出分類選單
function reloadFresh() {
  try { sessionStorage.setItem('frameAutoReload', '1'); } catch (e) {}
  var search = location.search.replace(/&_r=\d+/, '');
  location.replace(location.pathname + search + (search ? '&' : '?') + '_r=' + new Date().getTime());
}

// 每個新版本只自動重新載入一次，避免網站還沒更新好時無限重新載入
function triedVersion(v) {
  try {
    if (localStorage.getItem('frameTriedVersion') === String(v)) return true;
    localStorage.setItem('frameTriedVersion', String(v));
    return false;
  } catch (e) {
    return true; // 無法記錄就不自動重新載入
  }
}

// iOS 主畫面 app 切到背景再回來時不會重新載入，回到畫面的事件也不一定觸發；
// 改用時間差判斷：計時器兩次之間隔太久，代表曾被暫停在背景，直接整頁重新載入。
// 頁面載入不到 2 分鐘不會因此重新載入，就算誤判也不會變成快速循環。
var loadedAt = new Date().getTime(), lastBeat = loadedAt;
setInterval(function () {
  var now = new Date().getTime();
  if (now - lastBeat > 60000 && now - loadedAt > 120000) reloadFresh();
  lastBeat = now;
}, 10000);

// 右下角顯示拍攝日期時間："2026-05-27 16:57" → 大字 2026/05/27，小字 星期三　16:57
function showTaken(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}))?/.exec(s || '');
  if (!CONFIG.showPhotoDate || !m) { $('taken').style.display = 'none'; return; }
  var day = new Date(+m[1], +m[2] - 1, +m[3]).getDay();
  $('takenDate').innerHTML = '<span>' + m[1] + '/' + m[2] + '/' + m[3] + '</span>';
  $('takenTime').innerHTML = '<span>' + '星期' + WEEK[day] + (m[4] ? '　' + m[4] + ':' + m[5] : '') + '</span>';
  $('taken').style.display = 'block';
  // 日期字級自動調整成和下一行（星期＋時間）一樣寬；下一行比較短時維持基本字級
  var base = 20, dateEl = $('takenDate');
  dateEl.style.fontSize = base + 'px';
  var dateW = dateEl.firstChild.offsetWidth, lineW = $('takenTime').firstChild.offsetWidth;
  if (dateW && lineW > dateW) dateEl.style.fontSize = (base * lineW / dateW).toFixed(1) + 'px';
}

var wasSleeping = false;

// 夜間提示：「夜間休息中（22:00～09:00）」顯示 8 秒後淡出，避免以為相框壞了
var nightMsgTimer = null;
function showNightMsg() {
  var h = function (n) { return (n < 10 ? '0' : '') + n + ':00'; };
  $('nightMsg').innerHTML = '夜間休息中（' + h(CONFIG.sleepFrom) + '～' + h(CONFIG.sleepTo) + '）';
  $('nightMsg').className = 'show';
  clearTimeout(nightMsgTimer);
  nightMsgTimer = setTimeout(function () { $('nightMsg').className = ''; }, 8000);
}
function tick() {
  var d = new Date(), h = d.getHours();
  // 每小時稍微移動拍攝日期的位置，避免烙印
  var shift = (h % 4) * 6;
  $('taken').style.right = (36 + shift) + 'px';
  $('taken').style.bottom = (28 + shift) + 'px';
  var from = CONFIG.sleepFrom, to = CONFIG.sleepTo;
  var sleeping = from !== to && (from < to ? (h >= from && h < to) : (h >= from || h < to));
  if (wasSleeping && !sleeping) return reloadFresh(); // 每天夜間黑畫面結束時重新載入一次
  if (sleeping && !wasSleeping) { allowSleep(); stopMusic(); showNightMsg(); } // 進入夜間（含夜間打開網頁）：停音樂、讓 iPad 自動鎖定關螢幕
  wasSleeping = sleeping;
  document.body.className = sleeping ? 'sleeping' : '';
  updateAwakeHint();
}

// 讓螢幕保持亮著：NoSleep.js 在新瀏覽器用 Wake Lock，在舊版 iOS 播放一段隱藏的無聲小影片。
// iOS 規定要在使用者點擊的當下才能開始播放，所以 keepAwake() 要在點擊事件裡呼叫才會成功。
// 晚上黑畫面時段停止（allowSleep），讓 iPad 依「自動鎖定」時間關掉螢幕省電。
var noSleep = null, awake = false;
try { if (window.NoSleep) noSleep = new NoSleep(); } catch (e) {}
// iOS 可能只認「真的在畫面上播放」的影片：把隱藏影片放進畫面（2×2 像素、幾乎透明，看不到）
try {
  if (noSleep && noSleep.noSleepVideo) {
    var nsv = noSleep.noSleepVideo;
    nsv.setAttribute('playsinline', '');
    nsv.setAttribute('webkit-playsinline', '');
    nsv.style.cssText = 'position:absolute;left:0;bottom:0;width:2px;height:2px;opacity:0.01;pointer-events:none;';
    document.body.appendChild(nsv);
  }
} catch (e) {}
// 每次點擊都重新嘗試（iOS 沒點過畫面時的播放會被拒絕）；狀態以「影片實際上有沒有在播」為準
function keepAwake() {
  if (!noSleep || document.body.className === 'sleeping') return updateAwakeHint();
  var before = isAwake();
  try {
    var p = noSleep.enable();
    if (p && p.then) {
      p.then(function () {
        updateAwakeHint();
        if (!before && isAwake() && ids.length) loadList(null, 'awake'); // 真的開始了就回報一次
      }, updateAwakeHint);
    }
  } catch (e) {}
  updateAwakeHint();
}
function isAwake() {
  if (!noSleep) return false;
  var v = noSleep.noSleepVideo;
  if (v) return !v.paused;            // 舊版 iOS：隱藏影片有沒有在播
  return !!noSleep.isEnabled;         // 新瀏覽器：Wake Lock
}
// 看門狗：iOS 有時會自己把隱藏影片停掉，停了就擋不住自動鎖定。
// 白天每 5 秒檢查一次，停了就重新播放（這段影片沒有聲音軌，不用點擊也能播）。
var awakeRestarts = 0;
setInterval(function () {
  var v = noSleep && noSleep.noSleepVideo;
  if (!v || !v.paused || document.body.className === 'sleeping') return;
  awakeRestarts++;
  try { var p = v.play(); if (p && p.then) p.then(updateAwakeHint, updateAwakeHint); } catch (e) {}
}, 5000);

function allowSleep() {
  if (noSleep) { try { noSleep.disable(); } catch (e) {} }
  updateAwakeHint();
}
function updateAwakeHint() {
  awake = isAwake();
  var night = document.body.className === 'sleeping', text = '';
  if (started && !night && musicReady()) text = '點一下畫面開始播放音樂';
  else if (started && !night && noSleep && !awake) text = '點一下畫面，讓螢幕保持亮著';
  $('awakeHint').innerHTML = text;
  $('awakeHint').style.display = text ? 'block' : 'none';
}

// ---------- 背景音樂 ----------
// 音樂放在相框資料夾的 Music 子資料夾。iOS 規定有聲音的播放必須在點擊當下開始，
// 所以先把下一首預先下載好，點一下畫面時立刻播放；播完自動接下一首，晚上黑畫面時段停止。
// （iOS 不能用程式調音量，請用 iPad 的音量鍵。）
var tracks = [], trackIdx = 0, nextTrack = null, musicOn = false, fetchingTrack = false, playSeq = 0;
var musicWaiting = false; // 上一首播完、下一首還在下載：下載好就自動接著播
function musicReady() { return CONFIG.music && !musicOn && !musicWaiting && !!nextTrack; }
// 讀音樂清單（隨機排序）；每播完一輪會重讀一次，Music 資料夾新增或刪除的曲子下一輪就生效
var trackFails = 0;
function loadMusic() {
  if (!CONFIG.music) return;
  api('action=music&cat=' + encodeURIComponent(CATEGORY), function (d) {
    tracks = shuffleList(d.tracks || []);
    trackIdx = 0;
    trackFails = 0;
    fetchTrack();
  }, function () { setTimeout(loadMusic, 60000); });
}
function fetchTrack() {
  if (!tracks.length || nextTrack || fetchingTrack) return;
  if (trackIdx >= tracks.length) return loadMusic(); // 一輪播完：重讀清單
  var t = tracks[trackIdx];
  fetchingTrack = true;
  api('action=audio&id=' + encodeURIComponent(t.id), function (d) {
    fetchingTrack = false;
    trackFails = 0;
    nextTrack = d.src;
    if (musicWaiting) { musicWaiting = false; return playNextTrack(); }
    updateAwakeHint();
  }, function () {
    // 這首讀不到（例如已經從資料夾刪掉）：跳過換下一首；連續失敗太多次就稍後重讀清單
    fetchingTrack = false;
    trackIdx++;
    if (++trackFails > tracks.length) { trackFails = 0; setTimeout(loadMusic, 60000); return; }
    setTimeout(fetchTrack, 3000);
  });
}
function playNextTrack() {
  var a = $('bgm');
  if (!nextTrack) {
    if (musicOn) { musicWaiting = true; fetchTrack(); } // 播放中換曲但下一首還沒好：等它下載完自動播
    return updateAwakeHint();
  }
  a.src = nextTrack;
  nextTrack = null;
  trackIdx++;
  musicOn = true;
  // 換曲時上一首的播放請求會被中斷而報錯；只有「最新這次」失敗才算停止
  var token = ++playSeq;
  try {
    var p = a.play();
    // 播放請求被暫停或換曲中斷（AbortError）不算失敗
    if (p && p.catch) p.catch(function (err) { if (token === playSeq && !(err && err.name === 'AbortError')) { musicOn = false; updateAwakeHint(); } });
  } catch (e) { musicOn = false; }
  fetchTrack();
  updateAwakeHint();
}
function stopMusic() {
  try { $('bgm').pause(); } catch (e) {}
  musicOn = false;
  musicPaused = false;
  musicWaiting = false;
  updateAwakeHint();
}
$('bgm').addEventListener('ended', playNextTrack);

// 點一下：嘗試全螢幕並換下一張（下一張還沒載好就等載好立刻換）
function onTap() {
  var el = document.documentElement;
  var fs = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fs && !(document.fullscreenElement || document.webkitFullscreenElement)) {
    try { var p = fs.call(el); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
  keepAwake();
  if (document.body.className === 'sleeping') showNightMsg(); // 夜間點畫面：顯示夜間提示
  // 暫停中點一下：恢復播放。要在點擊當下恢復（音樂需要使用者手勢），所以第一下就先處理
  if (!taps && paused) { resume(); return; }
  // 還沒開始音樂時，第一下順便開始音樂（iOS 規定要在點擊當下開始播放）；這一下仍算進連點次數
  if (!taps && started && musicReady() && document.body.className !== 'sleeping') playNextTrack();
  // 連點計數：每兩下間隔 0.3 秒內算同一串；停下來後依次數動作
  taps++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(function () {
    var n = taps;
    taps = 0;
    tapTimer = null;
    if (n === 2 && started) pause();                               // 點兩下：暫停（照片和音樂）
  }, 300);
}
var tapTimer = null, taps = 0;

// 滑動：向左＝下一張，向右＝上一張，向上＝相簿選單。
// 水平移動超過 50px 且明顯是橫向才算左右滑；往上超過 60px 且明顯是縱向才算向上滑
var touchX = 0, touchY = 0, touchT = 0;
document.addEventListener('touchstart', function (e) {
  if (pickerOpen() || !e.touches || !e.touches.length) return;
  touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; touchT = new Date().getTime();
}, false);
function swipeOf(e) {
  var t = e.changedTouches && e.changedTouches[0];
  if (!t || new Date().getTime() - touchT > 1000) return 0;
  var dx = t.clientX - touchX, dy = t.clientY - touchY;
  if (dy < -60 && -dy > Math.abs(dx) * 1.5) return 2;                 // 2 = 向上滑（相簿選單）
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return 0;
  return dx < 0 ? 1 : -1;                                             // 1 = 向左滑（下一張），-1 = 向右滑（上一張）
}
// 電腦：← → 換照片，空白鍵暫停／恢復
document.addEventListener('keydown', function (e) {
  if (pickerOpen()) return;
  if (e.keyCode === 39) showNext();
  else if (e.keyCode === 37) showPrev();
  else if (e.keyCode === 32) { e.preventDefault(); if (paused) resume(); else if (started) pause(); }
}, false);
// iOS Safari 點一般區域不會觸發 click，所以也監聽觸控；preventDefault 避免觸控後又補發一次 click。
// 分類選單打開時不攔截，讓下拉選單和按鈕可以正常操作。
document.addEventListener('touchend', function (e) {
  if (pickerOpen()) return;
  e.preventDefault();
  var swipe = swipeOf(e);
  if (swipe) {
    keepAwake();
    if (taps) { clearTimeout(tapTimer); tapTimer = null; taps = 0; }
    if (swipe === 2) showPicker(false);
    else if (swipe > 0) showNext();
    else showPrev();
    return;
  }
  onTap();
}, false);
document.addEventListener('click', function () { if (!pickerOpen()) onTap(); }, false);

// ---------- 分類選單 ----------
// 分類 = 相框資料夾第一層的子資料夾，各有自己的照片和 Music。選擇記在 localStorage，自動重新載入時沿用。
// 從主畫面或網址打開時（網址沒有 _r）先顯示選單，20 秒沒選就用上次的分類。
var CATEGORY = '';
try { CATEGORY = localStorage.getItem('frameCategory') || ''; } catch (e) {}
var pickerTimer = null;
function pickerOpen() { return $('catPicker').style.display === 'block'; }
var catNames = {};
function showPicker(countdown) {
  $('catPicker').style.display = 'block';
  $('catList').innerHTML = '';
  $('catHint').innerHTML = '讀取分類中…';
  api('action=categories', function (d) {
    var items = [{ id: '', name: '全部' }].concat(d.categories), found = false, i;
    for (i = 0; i < items.length; i++) if (items[i].id === CATEGORY) found = true;
    var current = found ? CATEGORY : '';
    $('catList').innerHTML = '';
    for (i = 0; i < items.length; i++) {
      var el = document.createElement('div');
      el.setAttribute('data-id', items[i].id);
      el.className = items[i].id === current ? 'current' : '';
      el.appendChild(document.createTextNode(items[i].name));
      el.onclick = chooseCategory;
      catNames[items[i].id] = items[i].name;
      $('catList').appendChild(el);
    }
    if (countdown) startCountdown(20, current); else $('catHint').innerHTML = '點一個相簿開始播放';
  }, function () {
    $('catHint').innerHTML = '讀取分類失敗，先繼續播放目前的分類';
    setTimeout(hidePicker, 3000);
  });
}
function startCountdown(sec, current) {
  clearInterval(pickerTimer);
  var text = function () { return sec + ' 秒後自動開始：' + (catNames[current] || '全部'); };
  $('catHint').innerHTML = text();
  pickerTimer = setInterval(function () {
    if (--sec <= 0) { clearInterval(pickerTimer); return hidePicker(); }
    $('catHint').innerHTML = text();
  }, 1000);
}
function hidePicker() {
  clearInterval(pickerTimer);
  $('catPicker').style.display = 'none';
}
// 點選單框以外的地方：取消，照目前的相簿繼續播（iOS 要 cursor:pointer 才會對一般區塊送出 click）
$('catPicker').onclick = function (e) {
  if (e.target !== this) return;
  if (e.stopPropagation) e.stopPropagation();
  hidePicker();
};

// 點一個相簿：換分類就重新載入（不會再出現選單）；選的是目前的分類就直接繼續，順便開始音樂
function chooseCategory(e) {
  if (e && e.stopPropagation) e.stopPropagation();
  var chosen = this.getAttribute('data-id') || '';
  try { localStorage.setItem('frameCategory', chosen); } catch (err) {}
  hidePicker();
  if (chosen !== CATEGORY) return reloadFresh();
  if (started && musicReady() && document.body.className !== 'sleeping') playNextTrack();
}
// 回到畫面上（切回 Safari / 主畫面 app、解鎖）時立刻重新讀清單；在背景時計時器會暫停，不能只靠定時更新
document.addEventListener('visibilitychange', function () {
  if (document.hidden) return;
  keepAwake();
  if (ids.length) loadList(null, 'visible');
});
window.addEventListener('pageshow', function (e) { if (e.persisted && ids.length) loadList(null, 'pageshow'); });
document.addEventListener('touchmove', function (e) { if (!pickerOpen()) e.preventDefault(); }, { passive: false }); // 避免畫面被拖動（分類選單打開時可以捲動）

// iOS 主畫面 app 模式（狀態列透明）時，舊版 iOS 回報的高度會少掉狀態列，底部留一條黑邊；
// 改用螢幕實際尺寸與方向自己算畫面大小。
function fit() {
  if (!navigator.standalone) return;
  var a = screen.width, b = screen.height;
  var landscape = typeof window.orientation === 'number' ? Math.abs(window.orientation) === 90
    : window.innerWidth > window.innerHeight;
  var w = landscape ? Math.max(a, b) : Math.min(a, b);
  var h = landscape ? Math.min(a, b) : Math.max(a, b);
  var els = [document.documentElement, document.body];
  for (var i = 0; i < els.length; i++) { els[i].style.width = w + 'px'; els[i].style.height = h + 'px'; }
  window.scrollTo(0, 0);
}
fit();
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function () { fit(); setTimeout(fit, 500); });

msg('載入中…（v' + VERSION + '）');
// 分類選單：手動重新整理或從主畫面打開時顯示；自動重新載入（reloadFresh 記下的旗標）時不顯示。
// 旗標讀過就清掉，所以只影響緊接著的這一次載入。網址裡的 _r 只是用來避開快取，載入後拿掉。
var autoReloaded = false;
try {
  autoReloaded = sessionStorage.getItem('frameAutoReload') === '1';
  sessionStorage.removeItem('frameAutoReload');
} catch (e) {}
try {
  if (history.replaceState && /[?&]_r=/.test(location.search)) {
    history.replaceState(null, '', location.pathname + location.search.replace(/&_r=\d+/, ''));
  }
} catch (e) {}
if (!autoReloaded) showPicker(true);
tick();
setInterval(tick, 10000);
keepAwake();
if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(API)) {
  msg('網址缺少 api 參數<br><small>格式：此網頁網址?api=Apps Script 網頁應用程式網址</small>');
} else {
  loadList(function () {
    waiting = true;
    prefetch();
    setInterval(function () { loadList(null, 'timer'); }, CONFIG.refreshListMin * 60000);
    loadMusic();
  }, 'start');
}
</script>
</body>
</html>

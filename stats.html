<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相框播放統計</title>
<style>
  :root { --bg: #f6f6f4; --card: #fff; --text: #222; --dim: #777; --line: #e6e6e2; --bar: #d9a441; --accent: #2a6f97; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --card: #202227; --text: #e8e8ea; --dim: #9a9ca3; --line: #2e3036; --bar: #d9a441; --accent: #6fb3d9; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 16px; }
  .cards { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: 0 -5px 14px; }
  .card { -webkit-flex: 1 1 120px; flex: 1 1 120px; margin: 5px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; }
  .card b { display: block; font-size: 22px; font-weight: 600; }
  .card span { color: var(--dim); font-size: 12px; }
  .bar-row { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-align-items: center; align-items: center; margin-bottom: 10px; }
  .bar-row span { color: var(--dim); font-size: 13px; margin-right: 6px; }
  button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 16px; padding: 5px 12px; margin: 3px 4px 3px 0; cursor: pointer; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .row { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .thumb { width: 64px; height: 48px; border-radius: 6px; background: var(--line) center / cover no-repeat; -webkit-flex: none; flex: none; }
  .info { -webkit-flex: 1; flex: 1; min-width: 0; margin: 0 10px; }
  .name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .count { width: 34%; max-width: 220px; -webkit-flex: none; flex: none; }
  .count-num { font-size: 13px; text-align: right; margin-bottom: 3px; }
  .track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .fill { height: 100%; background: var(--bar); border-radius: 3px; }
  .group-head { padding: 8px 10px; font-size: 12px; color: var(--dim); background: var(--bg); border-top: 1px solid var(--line); }
  #msg { color: var(--dim); padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>相框播放統計</h1>
  <div class="sub" id="sub">載入中…</div>
  <div class="bar-row" id="catRow"><span>分類</span></div>
  <div class="cards" id="cards"></div>
  <div class="bar-row">
    <span>排序</span>
    <button data-sort="most" class="on">播最多</button>
    <button data-sort="least">播最少</button>
    <button data-sort="taken">拍攝日期</button>
    <button data-sort="group">分組</button>
    <button id="reload">重新整理</button>
  </div>
  <div class="list" id="list"></div>
  <div id="msg"></div>
</div>
<script>
// 網址格式：stats.html?api=Apps Script 網頁應用程式網址（結尾 /exec）[&key=密碼]
function $(id) { return document.getElementById(id); }
function param(name) {
  var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search);
  return m ? decodeURIComponent(m[1]) : '';
}
var API = param('api'), KEY = param('key');
var photos = [], cats = [], catFilter = '', sortBy = 'most', thumbs = {}, thumbQueue = [], thumbActive = 0;

var seq = 0;
function api(query, ok, fail) {
  var name = '__stats_cb' + (++seq), s = document.createElement('script'), done = false;
  function cleanup() { done = true; try { delete window[name]; } catch (e) { window[name] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
  window[name] = function (d) { if (done) return; cleanup(); if (d && d.ok) ok(d); else fail((d && d.error) || '未知錯誤'); };
  s.onerror = function () { if (!done) { cleanup(); fail('連線失敗'); } };
  setTimeout(function () { if (!done) { cleanup(); fail('逾時'); } }, 60000);
  s.src = API + (API.indexOf('?') < 0 ? '?' : '&') + query + (KEY ? '&key=' + encodeURIComponent(KEY) : '') +
    '&callback=' + name + '&_=' + new Date().getTime();
  document.body.appendChild(s);
}

function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function load() {
  $('msg').innerHTML = '讀取中…（照片多時要幾秒）';
  api('action=stats', function (d) {
    photos = d.photos || [];
    cats = d.categories || [];
    buildCatRow();
    $('msg').innerHTML = photos.length ? '' : '資料夾裡沒有照片';
    var now = new Date();
    $('sub').innerHTML = '更新於 ' + now.getHours() + ':' + ('0' + now.getMinutes()).slice(-2) +
      '　·　所有裝置合計　·　組別是在各分類內分組（同相框播放）';
    summary();
    render();
  }, function (err) { $('msg').innerHTML = '讀取失敗：' + esc(err); });
}

// 分類篩選按鈕：全部 + 各分類
function buildCatRow() {
  var row = $('catRow'), list = [{ id: '', name: '全部' }].concat(cats);
  if (catFilter && !cats.some(function (c) { return c.id === catFilter; })) catFilter = '';
  row.innerHTML = '<span>分類</span>';
  for (var i = 0; i < list.length; i++) {
    var b = document.createElement('button');
    b.setAttribute('data-cat', list[i].id);
    b.className = list[i].id === catFilter ? 'on' : '';
    b.appendChild(document.createTextNode(list[i].name));
    b.onclick = function () {
      catFilter = this.getAttribute('data-cat');
      buildCatRow();
      summary();
      render();
    };
    row.appendChild(b);
  }
}

function filtered() {
  if (!catFilter) return photos;
  var out = [];
  for (var i = 0; i < photos.length; i++) if (photos[i].cat === catFilter) out.push(photos[i]);
  return out;
}

function summary() {
  var list = filtered(), n = list.length, total = 0, max = 0, min = Infinity, zero = 0;
  for (var i = 0; i < n; i++) {
    var p = list[i].plays;
    total += p; if (p > max) max = p; if (p < min) min = p; if (!p) zero++;
  }
  if (!n) min = 0;
  var cards = [['照片', n], ['總播放', total], ['平均', n ? (total / n).toFixed(1) : 0], ['最多', max], ['最少', min], ['還沒播過', zero]];
  var html = '';
  for (var j = 0; j < cards.length; j++) html += '<div class="card"><b>' + cards[j][1] + '</b><span>' + cards[j][0] + '</span></div>';
  $('cards').innerHTML = html;
}

function sorted() {
  var list = filtered().slice();
  var byTaken = function (a, b) { return (a.taken || a.uploaded) < (b.taken || b.uploaded) ? -1 : 1; };
  list.sort({
    most: function (a, b) { return b.plays - a.plays || byTaken(a, b); },
    least: function (a, b) { return a.plays - b.plays || byTaken(a, b); },
    taken: function (a, b) { return -byTaken(a, b); },
    group: function (a, b) { return (a.catName < b.catName ? -1 : a.catName > b.catName ? 1 : 0) || a.group - b.group || byTaken(a, b); }
  }[sortBy]);
  return list;
}

function render() {
  var list = sorted(), max = 1, html = '', lastGroup = null, i;
  for (i = 0; i < list.length; i++) if (list[i].plays > max) max = list[i].plays;
  for (i = 0; i < list.length; i++) {
    var p = list[i];
    if (sortBy === 'group' && p.cat + '/' + p.group !== lastGroup) {
      lastGroup = p.cat + '/' + p.group;
      html += '<div class="group-head">' + esc(p.catName) + '　·　第 ' + p.group + ' 組</div>';
    }
    html += '<div class="row">' +
      '<div class="thumb" id="t_' + p.id + '"' + (thumbs[p.id] ? ' style="background-image:url(' + thumbs[p.id] + ')"' : '') + '></div>' +
      '<div class="info"><div class="name">' + esc(p.name) + '</div>' +
      '<div class="meta">' + esc(p.catName) + '　·　第 ' + p.group + ' 組　·　' + (p.taken ? '拍攝 ' + esc(p.taken) : '無拍攝時間') + '</div></div>' +
      '<div class="count"><div class="count-num">' + p.plays + ' 次</div>' +
      '<div class="track"><div class="fill" style="width:' + (p.plays / max * 100).toFixed(1) + '%"></div></div></div>' +
      '</div>';
  }
  $('list').innerHTML = html;
  thumbQueue = [];
  for (i = 0; i < list.length; i++) if (!thumbs[list[i].id]) thumbQueue.push(list[i].id);
  for (i = 0; i < 4; i++) nextThumb();
}

// 縮圖一次最多同時讀 4 張（不計入播放次數）
function nextThumb() {
  if (thumbActive >= 4 || !thumbQueue.length) return;
  var id = thumbQueue.shift();
  if (thumbs[id]) return nextThumb();
  thumbActive++;
  api('action=thumb&id=' + encodeURIComponent(id), function (d) {
    thumbActive--;
    if (d.src) {
      thumbs[id] = d.src;
      var el = $('t_' + id);
      if (el) el.style.backgroundImage = 'url(' + d.src + ')';
    }
    nextThumb();
  }, function () { thumbActive--; nextThumb(); });
}

var buttons = document.querySelectorAll('button[data-sort]');
for (var b = 0; b < buttons.length; b++) {
  buttons[b].onclick = function () {
    for (var k = 0; k < buttons.length; k++) buttons[k].className = '';
    this.className = 'on';
    sortBy = this.getAttribute('data-sort');
    render();
  };
}
$('reload').onclick = load;

if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(API)) {
  $('sub').innerHTML = '';
  $('msg').innerHTML = '網址缺少 api 參數<br><small>格式：stats.html?api=Apps Script 網頁應用程式網址</small>';
} else {
  load();
}
</script>
</body>
</html>
